<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Template</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- GLOBAL SCROLL & THEME VARIABLES --- */
        html {
            scroll-behavior: smooth; /* Smooth scrolling for all anchor links */
            scroll-padding-top: 85px; /* Prevents sticky header from overlapping section titles */
        }

        :root {
            --bg-color: #f4fbf9; 
            --bg-alt: #ffffff;
            --text-primary: #152b27; 
            --text-secondary: #5c7d77; 
            --card-bg: #ffffff; 
            --accent: #7bd5c5; 
            --accent-dark: #329684;
            --accent-light: #e6f7f4;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            overflow-x: hidden; 
        }

        section { padding: 5rem 5%; }

        /* --- 3D FLIP LOADER --- */
        .flip-loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            background-color: var(--accent);
            animation: flipLoader 1.2s infinite ease-in-out;
            vertical-align: middle;
            margin: 0 5px;
        }

        @keyframes flipLoader {
            0% { transform: perspective(120px) rotateX(0deg) rotateY(0deg); }
            50% { transform: perspective(120px) rotateX(-180.1deg) rotateY(0deg); background-color: var(--accent-dark); }
            100% { transform: perspective(120px) rotateX(-180deg) rotateY(-179.9deg); background-color: var(--accent); }
        }

        /* --- THEME ANIMATION PACKAGES --- */
        
        /* 1. SLIDE PACKAGE (Default) */
        .slide-up, .slide-down, .slide-left, .slide-right {
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .slide-up { transform: translateY(100px); }
        .slide-down { transform: translateY(-100px); }
        .slide-left { transform: translateX(-100px); }
        .slide-right { transform: translateX(100px); }

        .slide-up.active, .slide-down.active, .slide-left.active, .slide-right.active {
            opacity: 1;
            transform: translate(0, 0);
        }

        /* 2. FADE PACKAGE */
        .fade-in { opacity: 0; transition: opacity 1s ease-in-out; }
        .fade-in.active { opacity: 1; }

        /* 3. ZOOM PACKAGE */
        .zoom-in { opacity: 0; transform: scale(0.85); transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1); }
        .zoom-in.active { opacity: 1; transform: scale(1); }

        /* 4. FLIP UP PACKAGE */
        .flip-up-anim {
            opacity: 0;
            transform: perspective(1000px) rotateX(-90deg);
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: bottom;
        }
        .flip-up-anim.active { opacity: 1; transform: perspective(1000px) rotateX(0deg); }

        /* 5. FLIP LEFT PACKAGE */
        .flip-left-anim {
            opacity: 0;
            transform: perspective(1000px) rotateY(-90deg);
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: left;
        }
        .flip-left-anim.active { opacity: 1; transform: perspective(1000px) rotateY(0deg); }

        /* 6. BOUNCE PACKAGE */
        .bounce-anim {
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .bounce-anim.active { opacity: 1; transform: scale(1); }

        /* 7. BLUR PACKAGE */
        .blur-anim {
            opacity: 0;
            filter: blur(10px);
            transform: translateY(20px);
            transition: all 0.8s ease-out;
        }
        .blur-anim.active { opacity: 1; filter: blur(0); transform: translateY(0); }

        /* 8. ROTATE PACKAGE */
        .rotate-anim {
            opacity: 0;
            transform: rotate(-10deg) scale(0.9);
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .rotate-anim.active { opacity: 1; transform: rotate(0) scale(1); }

        /* Mask text animation */
        .mask-container { overflow: hidden; display: block; }
        .mask-text {
            display: inline-block;
            transform: translateY(110%);
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .mask-container.active .mask-text { transform: translateY(0); }

        .delay-1 { transition-delay: 0.1s; }
        .delay-2 { transition-delay: 0.2s; }
        .delay-3 { transition-delay: 0.3s; }
        .mask-container.delay-1 .mask-text { transition-delay: 0.1s; }
        .mask-container.delay-2 .mask-text { transition-delay: 0.2s; }

        /* --- LAYOUT & STYLING --- */
        .section-header { text-align: center; margin-bottom: 3rem; }
        .section-header h5 { color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; font-size: 0.85rem; }
        .section-header h2 { font-size: 2.5rem; text-transform: uppercase; margin: 0; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background: var(--card-bg);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 10px rgba(123, 213, 197, 0.1);
            flex-wrap: wrap; 
        }
        .logo a { font-size: 1.5rem; font-weight: 700; color: var(--accent-dark); text-decoration: none; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Mobile Menu Button */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 2rem;
            color: var(--text-primary);
            cursor: pointer;
        }

        nav { display: block; }
        nav ul { list-style: none; display: flex; gap: 2rem; margin: 0; padding: 0; }
        
        /* Navbar Links - Added transitions for click events */
        nav a { 
            display: inline-block;
            text-decoration: none; 
            color: var(--text-primary); 
            font-weight: 600; 
            font-size: 0.9rem; 
            transition: color 0.3s ease, transform 0.1s ease; 
        }
        nav a:hover { color: var(--accent); }
        nav a:active { transform: scale(0.9); /* Tiny shrink effect on click */ }

        .hero { text-align: center; padding: 8rem 2rem; background-color: var(--bg-color); }
        .hero h5 { color: var(--accent-dark); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 1rem; }
        .hero h1 { font-size: 3.5rem; margin: 0 auto 2rem; max-width: 800px; line-height: 1.2; }
        .btn { display: inline-block; padding: 1rem 2.5rem; background: var(--accent); color: #fff; text-decoration: none; border-radius: 30px; font-weight: 600; transition: background 0.3s, transform 0.1s; border: none; cursor: pointer; }
        .btn:hover { background: var(--accent-dark); }
        .btn:active { transform: scale(0.95); }

        .about-section { background: var(--bg-alt); }
        .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; max-width: 1200px; margin: 0 auto; align-items: center; }
        .about-text h3 { font-size: 2rem; margin-bottom: 1rem; }
        .about-text p { color: var(--text-secondary); margin-bottom: 2rem; }
        .skill-bar { margin-bottom: 1.5rem; }
        .skill-info { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; }
        .progress-bg { background: var(--accent-light); height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-fill {
            background: var(--accent); height: 100%; border-radius: 4px; width: 0; 
            transition: width 1.5s cubic-bezier(0.25, 1, 0.5, 1) 0.3s;
        }
        .slide-left.active .fill-90 { width: 90%; }
        .slide-left.active .fill-85 { width: 85%; }
        .slide-left.active .fill-75 { width: 75%; }

        .services-section { background: var(--bg-color); }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; max-width: 1200px; margin: 0 auto; }
        .service-card { background: var(--card-bg); padding: 2.5rem 2rem; border-radius: 8px; border: 1px solid rgba(123, 213, 197, 0.2); text-align: center; transition: transform 0.3s ease; }
        .service-card:hover { transform: translateY(-5px); }
        .service-icon { width: 60px; height: 60px; background: var(--accent-light); color: var(--accent-dark); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; font-size: 1.5rem; font-weight: bold; }
        
        .video-section { background: var(--accent-dark); color: #fff; text-align: center; padding: 6rem 2rem; }
        .play-btn { display: inline-flex; align-items: center; justify-content: center; width: 80px; height: 80px; background: #fff; color: var(--accent-dark); border-radius: 50%; text-decoration: none; font-size: 2rem; margin-bottom: 1.5rem; transition: transform 0.2s ease; }
        .play-btn:hover { transform: scale(1.1); }

        .portfolio-section { background: var(--bg-alt); }
        .portfolio-filters { list-style: none; display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 3rem; padding: 0; flex-wrap: wrap; }
        .portfolio-filters a { text-decoration: none; color: var(--text-secondary); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; }
        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; max-width: 1200px; margin: 0 auto; }
        .portfolio-item { background: var(--bg-color); border-radius: 8px; overflow: hidden; border: 1px solid rgba(123, 213, 197, 0.2); transition: transform 0.3s ease; }
        .portfolio-item:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .portfolio-img { width: 100%; height: 250px; background-color: var(--accent-light); display: flex; align-items: center; justify-content: center; color: var(--accent-dark); font-size: 0.9rem; font-weight: 600; }
        .portfolio-info { padding: 2rem; }
        .portfolio-info h5 { color: var(--accent-dark); margin: 0 0 0.5rem 0; font-size: 0.8rem; }
        .portfolio-info h3 { margin: 0 0 1rem 0; font-size: 1.25rem; }
        .portfolio-info p { color: var(--text-secondary); font-size: 0.9rem; margin: 0; }

        .team-section { background: var(--bg-color); }
        .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; max-width: 1200px; margin: 0 auto; }
        .team-card { background: var(--card-bg); border-radius: 8px; overflow: hidden; border: 1px solid rgba(123, 213, 197, 0.2); text-align: center; }
        .team-img { width: 100%; height: 300px; background: var(--accent-light); }
        .team-info { padding: 2rem; }
        .team-info h3 { margin: 0 0 0.25rem 0; font-size: 1.25rem; }
        .team-info h5 { color: var(--accent-dark); margin: 0 0 1rem 0; font-weight: normal; }

        .contact-section { background: var(--bg-alt); }
        .contact-container { max-width: 600px; margin: 0 auto; text-align: center; }
        .contact-form input, .contact-form textarea { width: 100%; padding: 1rem; margin-bottom: 1rem; border: 1px solid rgba(123, 213, 197, 0.3); border-radius: 8px; background: var(--bg-color); font-family: 'Inter', sans-serif; box-sizing: border-box; outline: none; transition: border-color 0.3s ease; }
        .contact-form input:focus, .contact-form textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
        .contact-form textarea { height: 150px; resize: vertical; }

        footer { text-align: center; padding: 3rem; background: var(--bg-color); color: var(--text-secondary); font-size: 0.9rem; border-top: 1px solid var(--accent-light); }

        /* --- MOBILE RESPONSIVE MEDIA QUERIES --- */
        @media (max-width: 768px) {
            section { padding: 4rem 1.5rem; }
            html { scroll-padding-top: 70px; }
            
            /* Responsive Navigation */
            .menu-toggle { display: block; }
            nav { display: none; width: 100%; padding-top: 1rem; border-top: 1px solid rgba(0,0,0,0.05); margin-top: 1rem; }
            nav.open { display: block; }
            nav ul { flex-direction: column; gap: 1.5rem; align-items: center; }
            
            /* Typography Scaling */
            .hero { padding: 5rem 1.5rem; }
            .hero h1 { font-size: 2.2rem; }
            .section-header h2 { font-size: 2rem; }
            
            /* Layout Adjustments */
            .about-grid { grid-template-columns: 1fr; gap: 2rem; text-align: center; }
            .about-images { order: -1; margin-bottom: 1rem; }
            
            /* Grid fallback for very small screens */
            .portfolio-grid { grid-template-columns: 1fr; }
            .team-grid { grid-template-columns: 1fr; }
            .services-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <a href="#">Company.</a> 
        </div>
        <button class="menu-toggle" id="menu-toggle">☰</button>
        <nav id="nav-menu">
            <ul>
                <li><a href="#hero">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#portfolio">Portfolio</a></li>
                <li><a href="#team">Team</a></li>
                <li><a href="#contact">Book Appointment</a></li>
            </ul>
        </nav>
    </header>

<!-- HERO SECTION -->
<section class="hero" id="hero">
    <span class="mask-container"><h5 class="mask-text" id="hero-subtitle"><span class="flip-loader"></span></h5></span>
    <span class="mask-container delay-1"><h1 class="mask-text" id="hero-title"><span class="flip-loader"></span></h1></span> 
    <br>
    <a href="#portfolio" class="btn slide-up delay-2" id="hero-btn">View Our Work</a> 
</section>

<!-- ABOUT SECTION -->
<section class="about-section" id="about">
    <div class="about-grid">
        <div class="about-text slide-left">
            <h5 id="about-label"><span class="flip-loader"></span></h5>
            <h3 id="about-heading"><span class="flip-loader"></span></h3>
            <p id="about-desc"><span class="flip-loader"></span></p>
            
            <div class="skills-container" id="skills-container">
                <!-- Skills populated dynamically -->
            </div>
        </div>
        <div class="about-images slide-right">
            <div id="about-img-container" style="background: var(--accent-light); height: 400px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--accent-dark); font-weight: 600; background-size: cover; background-position: center;">
                [ Image Placeholder ]
            </div>
        </div>
    </div>
</section>

<!-- SERVICES SECTION -->
<section class="services-section" id="services">
    <div class="section-header slide-down">
        <h5 id="services-label"><span class="flip-loader"></span></h5>
        <h2 id="services-heading"><span class="flip-loader"></span></h2>
    </div>
    <div class="services-grid" id="services-grid">
        <!-- Services dynamically loaded -->
    </div>
</section>

<!-- VIDEO SECTION -->
<section class="video-section slide-up" id="video">
    <a href="#" id="video-link" class="play-btn" target="_blank">▶</a>
    <span class="mask-container"><h3 class="mask-text" id="video-title"><span class="flip-loader"></span></h3></span>
</section>

<!-- PORTFOLIO SECTION -->
<section class="portfolio-section" id="portfolio">
    <div class="section-header slide-down">
        <h5 id="portfolio-label"><span class="flip-loader"></span></h5>
        <h2 id="portfolio-heading"><span class="flip-loader"></span></h2>
    </div>
    <div class="portfolio-grid" id="portfolio-grid">
        <!-- Portfolio dynamically loaded -->
    </div>
</section>

<!-- TEAM SECTION -->
<section class="team-section" id="team">
    <div class="section-header mask-container">
        <h5 class="mask-text" id="team-label" style="color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; font-size: 0.85rem;"><span class="flip-loader"></span></h5>
        <br>
        <h2 class="mask-text" id="team-heading"><span class="flip-loader"></span></h2>
    </div>
    <div class="team-grid" id="team-grid">
        <!-- Team members dynamically loaded -->
    </div>
</section>

<!-- CONTACT SECTION -->
<section class="contact-section slide-up" id="contact">
    <div class="section-header">
        <h5 id="contact-label"><span class="flip-loader"></span></h5>
        <h2 id="contact-heading"><span class="flip-loader"></span></h2>
    </div>
    <div class="contact-container slide-down">
        <form class="contact-form">
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message" required></textarea>
            <button type="submit" class="btn" id="contact-btn-text">Book Appointment</button>
        </form>
    </div>
</section>

<!-- FOOTER -->
<footer>
    <p id="footer-text">&copy; 2026 Company Name. All rights reserved.</p>
</footer>

<!-- SUPABASE & SCROLL ANIMATION SCRIPT -->
<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabaseUrl = 'https://ohrumepiwvmytpwigddx.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ocnVtZXBpd3ZteXRwd2lnZGR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MTUyMDQsImV4cCI6MjEwMTQ5MTIwNH0.Fy1_dElDAIFDQht7Y--Nt7232qDKeHGjLNdZWc67pVE';
    
    const supabase = createClient(supabaseUrl, supabaseKey);

    // Mobile Menu Toggle Logic
    const menuBtn = document.getElementById('menu-toggle');
    const navMenu = document.getElementById('nav-menu');
    
    menuBtn.addEventListener('click', () => {
        navMenu.classList.toggle('open');
    });
    
    // Close menu when a link is clicked
    document.querySelectorAll('#nav-menu a').forEach(link => {
        link.addEventListener('click', () => {
            navMenu.classList.remove('open');
        });
    });

    // Helper Function to swap classes per specific section
    function applySectionAnimation(sectionId, animStyle) {
        if (!animStyle || animStyle === 'slide') return;
        const section = document.getElementById(sectionId);
        if (!section) return;

        // Targets elements inside the section, and the section itself if applicable
        const targets = [section, ...section.querySelectorAll('.slide-up, .slide-down, .slide-left, .slide-right')];
        
        targets.forEach(el => {
            if (el.classList.contains('slide-up') || el.classList.contains('slide-down') || 
                el.classList.contains('slide-left') || el.classList.contains('slide-right')) {
                
                el.classList.remove('slide-up', 'slide-down', 'slide-left', 'slide-right');
                
                if (animStyle === 'fade') el.classList.add('fade-in');
                if (animStyle === 'zoom') el.classList.add('zoom-in');
                if (animStyle === 'flip-up') el.classList.add('flip-up-anim');
                if (animStyle === 'flip-left') el.classList.add('flip-left-anim');
                if (animStyle === 'bounce') el.classList.add('bounce-anim');
                if (animStyle === 'blur') el.classList.add('blur-anim');
                if (animStyle === 'rotate') el.classList.add('rotate-anim');
            }
        });
    }

    async function loadAllContent() {
        try {
            const { data: sections, error } = await supabase.from('portfolio_content').select('*');
            
            if (error) throw error;
            if (!sections) return;

            sections.forEach(section => {
                const id = section.section_name;
                const d = section.data;

                // --- THEME COLOR INJECTION ---
                if (id === 'theme_section') {
                    const root = document.documentElement;
                    if (d.bgColor) root.style.setProperty('--bg-color', d.bgColor);
                    if (d.bgAlt) root.style.setProperty('--bg-alt', d.bgAlt);
                    if (d.cardBg) root.style.setProperty('--card-bg', d.cardBg);
                    if (d.textPrimary) root.style.setProperty('--text-primary', d.textPrimary);
                    if (d.textSecondary) root.style.setProperty('--text-secondary', d.textSecondary);
                    if (d.accent) root.style.setProperty('--accent', d.accent);
                    if (d.accentDark) root.style.setProperty('--accent-dark', d.accentDark);
                    if (d.accentLight) root.style.setProperty('--accent-light', d.accentLight);
                }
                
                // --- SECTION CONTENT & COMBO INJECTION ---
                else if (id === 'hero_section') {
                    if (d.subtitle) document.getElementById('hero-subtitle').innerText = d.subtitle;
                    if (d.title) document.getElementById('hero-title').innerText = d.title;
                    if (d.btnText) document.getElementById('hero-btn').innerText = d.btnText;
                    
                    applySectionAnimation('hero', d.animationStyle);
                }
                else if (id === 'about_section') {
                    if (d.label) document.getElementById('about-label').innerText = d.label;
                    if (d.heading) document.getElementById('about-heading').innerText = d.heading;
                    if (d.desc) document.getElementById('about-desc').innerText = d.desc;
                    if (d.imageUrl) document.getElementById('about-img-container').style.backgroundImage = `url('${d.imageUrl}')`;
                    
                    if (d.skills) {
                        document.getElementById('skills-container').innerHTML = d.skills.map(s => `
                            <div class="skill-bar">
                                <div class="skill-info"><span>${s.name}</span><span>${s.percent}%</span></div>
                                <div class="progress-bg"><div class="progress-fill" style="width: ${s.percent}%"></div></div>
                            </div>
                        `).join('');
                    }
                    
                    applySectionAnimation('about', d.animationStyle);
                }
                else if (id === 'services_section') {
                    if (d.label) document.getElementById('services-label').innerText = d.label;
                    if (d.heading) document.getElementById('services-heading').innerText = d.heading;
                    if (d.items) {
                        document.getElementById('services-grid').innerHTML = d.items.map((item, idx) => `
                            <div class="service-card slide-up">
                                <div class="service-icon">${item.icon || '0' + (idx + 1)}</div>
                                <h3>${item.title}</h3>
                                <p>${item.desc}</p>
                            </div>
                        `).join('');
                    }
                    
                    applySectionAnimation('services', d.animationStyle);
                }
                else if (id === 'video_section') {
                    if (d.title) document.getElementById('video-title').innerText = d.title;
                    if (d.url) document.getElementById('video-link').href = d.url;
                    
                    applySectionAnimation('video', d.animationStyle);
                }
                else if (id === 'projects_section') {
                    if (d.label) document.getElementById('portfolio-label').innerText = d.label;
                    if (d.heading) document.getElementById('portfolio-heading').innerText = d.heading;
                    if (d.items) {
                        document.getElementById('portfolio-grid').innerHTML = d.items.map(p => `
                            <div class="portfolio-item slide-up">
                                <div class="portfolio-img" style="background-image: url('${p.imageUrl || ''}'); background-size: cover; background-position: center; min-height: 200px;">
                                    ${!p.imageUrl ? '[ Image Placeholder ]' : ''}
                                </div>
                                <div class="portfolio-info">
                                    <h5>${p.category}</h5>
                                    <h3>${p.title}</h3>
                                    <p>${p.desc}</p>
                                </div>
                            </div>
                        `).join('');
                    }
                }
                else if (id === 'team_section') {
                    if (d.label) document.getElementById('team-label').innerText = d.label;
                    if (d.heading) document.getElementById('team-heading').innerText = d.heading;
                    if (d.members) {
                        document.getElementById('team-grid').innerHTML = d.members.map(m => `
                            <div class="team-card slide-up">
                                <div class="team-img" style="background-image: url('${m.imageUrl || ''}'); background-size: cover; background-position: center; min-height: 250px;"></div>
                                <div class="team-info">
                                    <h3>${m.name}</h3>
                                    <h5>${m.role}</h5>
                                </div>
                            </div>
                        `).join('');
                    }
                }
                else if (id === 'contact_section') {
                    if (d.label) document.getElementById('contact-label').innerText = d.label;
                    if (d.heading) document.getElementById('contact-heading').innerText = d.heading;
                    if (d.btnText) document.getElementById('contact-btn-text').innerText = d.btnText;
                    if (d.footer) document.getElementById('footer-text').innerText = d.footer;
                    
                    applySectionAnimation('contact', d.animationStyle);
                }
            });

            // Re-bind Intersection Observer after content inserts and animation swaps
            initObserver();
        } catch (err) {
            console.error("Error loading Supabase data:", err);
        }
    }

    function initObserver() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                } else {
                    entry.target.classList.remove('active');
                }
            });
        }, { threshold: 0.15 });

        // Observe ALL possible animation classes
        document.querySelectorAll('.slide-up, .slide-down, .slide-left, .slide-right, .fade-in, .zoom-in, .flip-up-anim, .flip-left-anim, .bounce-anim, .blur-anim, .rotate-anim, .mask-container')
               .forEach(el => observer.observe(el));
    }

    document.addEventListener("DOMContentLoaded", loadAllContent);
</script>
</body>
</html>
