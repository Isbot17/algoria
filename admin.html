<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4fbf9; 
            --card-bg: #ffffff; 
            --text-primary: #152b27; 
            --accent: #7bd5c5; 
            --accent-dark: #329684;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(123, 213, 197, 0.15);
            width: 100%;
            max-width: 600px;
        }
        h2 { margin-top: 0; color: var(--accent-dark); }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem; }
        input, textarea {
            width: 100%; padding: 0.75rem; border: 1px solid #ddd;
            border-radius: 6px; font-family: inherit; box-sizing: border-box;
        }
        .btn {
            background: var(--accent); color: white; padding: 0.75rem 1.5rem;
            border: none; border-radius: 6px; font-weight: 600; cursor: pointer;
            transition: background 0.3s; width: 100%;
        }
        .btn:hover { background: var(--accent-dark); }
        #dashboard-section { display: none; } /* Hidden until logged in */
        .logout-btn { background: #ff4d4d; margin-top: 1rem; }
        .logout-btn:hover { background: #cc0000; }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGIN SECTION -->
        <div id="login-section">
            <h2>Admin Login</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="admin-email" placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="admin-password" placeholder="••••••••">
            </div>
            <button class="btn" id="login-btn">Login</button>
            <p id="login-error" style="color: red; display: none; font-size: 0.85rem; margin-top: 1rem;">Invalid credentials.</p>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboard-section">
            <h2>Edit Portfolio Content</h2>
            
            <!-- Example: Editing the Hero Section -->
            <div class="form-group">
                <label>Hero Subtitle (e.g., Creative Digital Agency)</label>
                <input type="text" id="hero-subtitle">
            </div>
            <div class="form-group">
                <label>Hero Main Title</label>
                <input type="text" id="hero-title">
            </div>
            
            <!-- Example: File upload for images/videos -->
            <div class="form-group">
                <label>Upload New Hero Background Video/Image</label>
                <input type="file" id="hero-media" accept="image/*,video/*">
            </div>

            <button class="btn" id="save-btn">Save Changes</button>
            <button class="btn logout-btn" id="logout-btn">Logout</button>
            <p id="save-success" style="color: green; display: none; font-size: 0.85rem; margin-top: 1rem;">Changes saved successfully!</p>
        </div>
    </div>

    <!-- FIREBASE INTEGRATION SCRIPT -->
    <script type="module">
    // Import required Firebase modules via CDN
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // Your actual Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyCqhh4-Z7KsMP1bnnmsTDt5YXlSA28a0H0",
        authDomain: "algoria-33961.firebaseapp.com",
        projectId: "algoria-33961",
        storageBucket: "algoria-33961.firebasestorage.app",
        messagingSenderId: "30543782632",
        appId: "1:30543782632:web:d387115e183a15fe2b5f5d",
        measurementId: "G-FHHZ358DGR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // UI Elements
    const loginSection = document.getElementById('login-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const saveBtn = document.getElementById('save-btn');

    // Monitor Authentication State
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            loginSection.style.display = 'none';
            dashboardSection.style.display = 'block';
            
            // Fetch existing data
            const docRef = doc(db, "portfolio", "hero_section");
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                document.getElementById('hero-subtitle').value = docSnap.data().subtitle || "";
                document.getElementById('hero-title').value = docSnap.data().title || "";
            }
        } else {
            loginSection.style.display = 'block';
            dashboardSection.style.display = 'none';
        }
    });

    // Login Logic
    loginBtn.addEventListener('click', () => {
        const email = document.getElementById('admin-email').value;
        const password = document.getElementById('admin-password').value;
        signInWithEmailAndPassword(auth, email, password)
            .catch(error => {
                document.getElementById('login-error').style.display = 'block';
            });
    });

    // Logout Logic
    logoutBtn.addEventListener('click', () => signOut(auth));

    // Save Data Logic (Text and Media)
    saveBtn.addEventListener('click', async () => {
        const subtitle = document.getElementById('hero-subtitle').value;
        const title = document.getElementById('hero-title').value;
        const mediaFile = document.getElementById('hero-media').files[0];

        let mediaUrl = "";

        if (mediaFile) {
            const storageRef = ref(storage, 'portfolio_media/' + mediaFile.name);
            await uploadBytes(storageRef, mediaFile);
            mediaUrl = await getDownloadURL(storageRef);
        }

        const dataToSave = {
            subtitle: subtitle,
            title: title
        };
        if (mediaUrl) dataToSave.mediaUrl = mediaUrl;

        await setDoc(doc(db, "portfolio", "hero_section"), dataToSave, { merge: true });
        
        document.getElementById('save-success').style.display = 'block';
        setTimeout(() => document.getElementById('save-success').style.display = 'none', 3000);
    });
</script>
</body>
</html>
