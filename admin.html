<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Admin Dashboard | Algoria</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #eef2f6; 
            --card-bg: #ffffff;
            --text-primary: #1e293b; 
            --accent: #0f172a; 
            --accent-light: #334155;
            --success: #10b981;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            margin: 0; 
            padding: 2rem; 
        }
        
        .header-container {
            max-width: 1200px;
            margin: 0 auto 2rem auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 { 
            color: var(--accent); 
            margin: 0;
            font-size: 1.8rem;
        }

        /* The Grid: Forces 2 equal columns to create distinct rows of cards */
        .dashboard-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2.5rem;
            margin-bottom: 3rem;
        }

        /* Mobile fallback so it doesn't break on small screens */
        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Distinct Card Design */
        .section-box { 
            background: var(--card-bg); 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .section-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.1);
        }

        /* Colored Card Headers */
        .section-box h2 {
            margin: 0;
            background: var(--accent);
            color: white;
            font-size: 1.1rem;
            padding: 1.2rem 1.5rem;
            font-weight: 600;
        }

        /* Card Body Padding */
        .card-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        
        .form-group { margin-bottom: 1.2rem; }
        
        label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 0.4rem; 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            color: #64748b; 
            letter-spacing: 0.5px;
        }
        
        input, textarea { 
            width: 100%; 
            padding: 0.75rem; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-light);
        }

        textarea { height: 90px; resize: vertical; }
        
        .card-actions {
            margin-top: auto;
            padding-top: 1rem;
        }
        
        .btn { 
            background: var(--accent); 
            color: white; 
            padding: 0.8rem 1.5rem; 
            border: none; 
            border-radius: 6px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.2s; 
            width: 100%; 
            font-size: 0.95rem;
        }
        
        .btn:hover { background: var(--accent-light); }
        .btn-danger { background: #ef4444; width: auto; padding: 0.6rem 1.2rem; }
        .btn-danger:hover { background: #dc2626; }
        
        #dashboard-section { display: none; }
        #login-section { max-width: 400px; margin: 4rem auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
        #login-section h2 { color: var(--accent); margin-top: 0; }
        
        .status-msg { 
            margin-top: 0.75rem; 
            color: var(--success); 
            font-weight: 600; 
            display: none; 
            text-align: center; 
            background: #d1fae5;
            padding: 0.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        
        .skill-group { display: flex; gap: 15px; }
        .skill-group input[type="text"] { flex: 2; }
        .skill-group input[type="number"] { flex: 1; }
        .divider { height: 1px; background: #e2e8f0; margin: 1.5rem 0; }
    </style>
</head>
<body>

    <!-- LOGIN FORM -->
    <div id="login-section">
        <h2>Admin Portal Sign In</h2>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="admin-email" placeholder="admin@algoria.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="admin-password">
        </div>
        <button class="btn" id="login-btn">Login</button>
        <p id="login-error" style="color:#ef4444; display:none; margin-top:1rem; text-align: center;">Invalid Login Credentials</p>
    </div>

    <!-- DASHBOARD FORM -->
    <div id="dashboard-section">
        
        <div class="header-container">
            <h1>Portfolio CMS Control Center</h1>
            <button class="btn btn-danger" id="logout-btn">Logout</button>
        </div>

        <!-- GRID CONTAINER FOR CARDS -->
        <div class="dashboard-grid">
            
            <!-- HERO SECTION CARD -->
            <div class="section-box">
                <h2>1. Hero Section</h2>
                <div class="card-body">
                    <div class="form-group"><label>Subtitle</label><input type="text" id="hero-subtitle-input"></div>
                    <div class="form-group"><label>Main Title</label><input type="text" id="hero-title-input"></div>
                    <div class="form-group"><label>Button Text</label><input type="text" id="hero-btn-input"></div>
                    
                    <div class="card-actions">
                        <button class="btn" onclick="saveHero()">Save Hero Section</button>
                        <p class="status-msg" id="hero-msg">Saved successfully!</p>
                    </div>
                </div>
            </div>

            <!-- ABOUT SECTION CARD -->
            <div class="section-box">
                <h2>2. About Section</h2>
                <div class="card-body">
                    <div class="form-group"><label>Section Label</label><input type="text" id="about-label-input"></div>
                    <div class="form-group"><label>Heading</label><input type="text" id="about-heading-input"></div>
                    <div class="form-group"><label>Description</label><textarea id="about-desc-input"></textarea></div>
                    <div class="form-group"><label>Image URL</label><input type="text" id="about-img-input" placeholder="https://..."></div>
                    
                    <div class="divider"></div>
                    
                    <label>Skills Tracker</label>
                    <div class="form-group skill-group"><input type="text" id="s1-name" placeholder="Skill 1 Name"> <input type="number" id="s1-pct" placeholder="%"></div>
                    <div class="form-group skill-group"><input type="text" id="s2-name" placeholder="Skill 2 Name"> <input type="number" id="s2-pct" placeholder="%"></div>
                    
                    <div class="card-actions">
                        <button class="btn" onclick="saveAbout()">Save About Section</button>
                        <p class="status-msg" id="about-msg">Saved successfully!</p>
                    </div>
                </div>
            </div>

            <!-- SERVICES CARD -->
            <div class="section-box">
                <h2>3. Services Section</h2>
                <div class="card-body">
                    <div class="form-group"><label>Section Label</label><input type="text" id="services-label-input"></div>
                    <div class="form-group"><label>Heading</label><input type="text" id="services-heading-input"></div>
                    
                    <div class="divider"></div>
                    
                    <label>Service 1</label>
                    <div class="form-group"><input type="text" id="srv1-title" placeholder="Title"> <textarea id="srv1-desc" placeholder="Description" style="height:60px; margin-top:5px;"></textarea></div>
                    
                    <label>Service 2</label>
                    <div class="form-group"><input type="text" id="srv2-title" placeholder="Title"> <textarea id="srv2-desc" placeholder="Description" style="height:60px; margin-top:5px;"></textarea></div>
                    
                    <label>Service 3</label>
                    <div class="form-group"><input type="text" id="srv3-title" placeholder="Title"> <textarea id="srv3-desc" placeholder="Description" style="height:60px; margin-top:5px;"></textarea></div>

                    <div class="card-actions">
                        <button class="btn" onclick="saveServices()">Save Services</button>
                        <p class="status-msg" id="services-msg">Saved successfully!</p>
                    </div>
                </div>
            </div>

            <!-- VIDEO BANNER CARD -->
            <div class="section-box">
                <h2>4. Video Banner</h2>
                <div class="card-body">
                    <div class="form-group"><label>Banner Title</label><input type="text" id="video-title-input"></div>
                    <div class="form-group"><label>Video Link URL</label><input type="text" id="video-url-input"></div>
                    
                    <div class="card-actions">
                        <button class="btn" onclick="saveVideo()">Save Video Section</button>
                        <p class="status-msg" id="video-msg">Saved successfully!</p>
                    </div>
                </div>
            </div>

            <!-- CONTACT & FOOTER CARD -->
            <div class="section-box">
                <h2>5. Contact & Footer</h2>
                <div class="card-body">
                    <div class="form-group"><label>Contact Label</label><input type="text" id="contact-label-input"></div>
                    <div class="form-group"><label>Contact Heading</label><input type="text" id="contact-heading-input"></div>
                    <div class="form-group"><label>Button Label</label><input type="text" id="contact-btn-input"></div>
                    <div class="divider"></div>
                    <div class="form-group"><label>Footer Text</label><input type="text" id="footer-text-input"></div>
                    
                    <div class="card-actions">
                        <button class="btn" onclick="saveContact()">Save Contact & Footer</button>
                        <p class="status-msg" id="contact-msg">Saved successfully!</p>
                    </div>
                </div>
            </div>

        </div> <!-- END OF GRID -->
    </div>

<!-- SUPABASE SCRIPT -->
<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabaseUrl = 'https://ohrumepiwvmytpwigddx.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ocnVtZXBpd3ZteXRwd2lnZGR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MTUyMDQsImV4cCI6MjEwMTQ5MTIwNH0.Fy1_dElDAIFDQht7Y--Nt7232qDKeHGjLNdZWc67pVE';
    
    const supabase = createClient(supabaseUrl, supabaseKey);

    // Auth state control
    async function checkUser() {
        const { data: { user } } = await supabase.auth.getUser();
        if (user) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';
            loadAdminData();
        } else {
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('dashboard-section').style.display = 'none';
        }
    }
    
    checkUser();

    // Login logic
    document.getElementById('login-btn').addEventListener('click', async () => {
        const email = document.getElementById('admin-email').value;
        const password = document.getElementById('admin-password').value;
        
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
            document.getElementById('login-error').style.display = 'block';
        } else {
            document.getElementById('login-error').style.display = 'none';
            checkUser();
        }
    });

    // Logout logic
    document.getElementById('logout-btn').addEventListener('click', async () => {
        await supabase.auth.signOut();
        checkUser();
    });

    // Load existing values into form fields
    async function loadAdminData() {
        const { data } = await supabase.from('portfolio_content').select('*');
        if (!data) return;

        data.forEach(section => {
            const d = section.data;
            if (section.section_name === 'hero_section') {
                document.getElementById('hero-subtitle-input').value = d.subtitle || "";
                document.getElementById('hero-title-input').value = d.title || "";
                document.getElementById('hero-btn-input').value = d.btnText || "";
            }
            if (section.section_name === 'about_section') {
                document.getElementById('about-label-input').value = d.label || "";
                document.getElementById('about-heading-input').value = d.heading || "";
                document.getElementById('about-desc-input').value = d.desc || "";
                document.getElementById('about-img-input').value = d.imageUrl || "";
                
                if (d.skills && d.skills[0]) {
                    document.getElementById('s1-name').value = d.skills[0].name || "";
                    document.getElementById('s1-pct').value = d.skills[0].percent || "";
                }
                if (d.skills && d.skills[1]) {
                    document.getElementById('s2-name').value = d.skills[1].name || "";
                    document.getElementById('s2-pct').value = d.skills[1].percent || "";
                }
            }
            if (section.section_name === 'services_section') {
                document.getElementById('services-label-input').value = d.label || "";
                document.getElementById('services-heading-input').value = d.heading || "";
                
                if (d.items && d.items[0]) {
                    document.getElementById('srv1-title').value = d.items[0].title || "";
                    document.getElementById('srv1-desc').value = d.items[0].desc || "";
                }
                if (d.items && d.items[1]) {
                    document.getElementById('srv2-title').value = d.items[1].title || "";
                    document.getElementById('srv2-desc').value = d.items[1].desc || "";
                }
                if (d.items && d.items[2]) {
                    document.getElementById('srv3-title').value = d.items[2].title || "";
                    document.getElementById('srv3-desc').value = d.items[2].desc || "";
                }
            }
            if (section.section_name === 'video_section') {
                document.getElementById('video-title-input').value = d.title || "";
                document.getElementById('video-url-input').value = d.url || "";
            }
            if (section.section_name === 'contact_section') {
                document.getElementById('contact-label-input').value = d.label || "";
                document.getElementById('contact-heading-input').value = d.heading || "";
                document.getElementById('contact-btn-input').value = d.btnText || "";
                document.getElementById('footer-text-input').value = d.footer || "";
            }
        });
    }

    // Save Functions exposed globally
    window.saveHero = async () => {
        const content = {
            subtitle: document.getElementById('hero-subtitle-input').value,
            title: document.getElementById('hero-title-input').value,
            btnText: document.getElementById('hero-btn-input').value
        };
        
        const { error } = await supabase.from('portfolio_content').upsert({ section_name: 'hero_section', data: content });
        
        if (error) {
            console.error("Supabase Error:", error);
            alert("Failed to save! Check the console.");
        } else {
            showMsg('hero-msg');
        }
    };

    window.saveAbout = async () => {
        const content = {
            label: document.getElementById('about-label-input').value,
            heading: document.getElementById('about-heading-input').value,
            desc: document.getElementById('about-desc-input').value,
            imageUrl: document.getElementById('about-img-input').value,
            skills: [
                { name: document.getElementById('s1-name').value, percent: document.getElementById('s1-pct').value },
                { name: document.getElementById('s2-name').value, percent: document.getElementById('s2-pct').value }
            ]
        };
        await supabase.from('portfolio_content').upsert({ section_name: 'about_section', data: content });
        showMsg('about-msg');
    };

    window.saveServices = async () => {
        const content = {
            label: document.getElementById('services-label-input').value,
            heading: document.getElementById('services-heading-input').value,
            items: [
                { icon: "01", title: document.getElementById('srv1-title').value, desc: document.getElementById('srv1-desc').value },
                { icon: "02", title: document.getElementById('srv2-title').value, desc: document.getElementById('srv2-desc').value },
                { icon: "03", title: document.getElementById('srv3-title').value, desc: document.getElementById('srv3-desc').value }
            ]
        };
        await supabase.from('portfolio_content').upsert({ section_name: 'services_section', data: content });
        showMsg('services-msg');
    };

    window.saveVideo = async () => {
        const content = {
            title: document.getElementById('video-title-input').value,
            url: document.getElementById('video-url-input').value
        };
        await supabase.from('portfolio_content').upsert({ section_name: 'video_section', data: content });
        showMsg('video-msg');
    };

    window.saveContact = async () => {
        const content = {
            label: document.getElementById('contact-label-input').value,
            heading: document.getElementById('contact-heading-input').value,
            btnText: document.getElementById('contact-btn-input').value,
            footer: document.getElementById('footer-text-input').value
        };
        await supabase.from('portfolio_content').upsert({ section_name: 'contact_section', data: content });
        showMsg('contact-msg');
    };

    function showMsg(id) {
        const el = document.getElementById(id);
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 3000);
    }
</script>
</body>
</html>
